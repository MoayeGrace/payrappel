name: payrappel
description: "Gestion des paiements et rappels pour petites activités."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Gestion d'état
  provider: ^6.1.2

  # Navigation
  go_router: ^14.3.0

  # Utilitaires
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

  # Notifications locales
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1

  # Partage et liens externes
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Excel
  excel: ^4.0.6

  # Graphiques
  fl_chart: '>=0.69.0 <0.70.0'

  # Contacts téléphone
  flutter_contacts: ^1.1.9+2

  # Sélection d'image (logo entreprise)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
